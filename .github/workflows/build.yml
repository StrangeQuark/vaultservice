name: VaultService Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, linux-server]

    env:
      KUBERNETES_CICD_TOKEN: ${{ secrets.KUBERNETES_CICD_TOKEN }}
      KUBERNETES_ENABLED: ${{ vars.KUBERNETES_ENABLED }}
      SERVICE_IMAGE_REPOSITORY: ${{ vars.SERVICE_IMAGE_REPOSITORY }}
      KUBERNETESERVICE_URL: ${{ vars.KUBERNETESERVICE_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Retrieve Env Vars
        run: |
          echo "Copying vaultservice.env from secret file..."
          printf "%s\n" "${{ secrets.VAULT_ENV_FILE }}" > vaultservice.env
          echo "vaultservice.env copied."

      - name: Deploy with Docker Compose
        run: |
          set -e

          if [ "$KUBERNETES_ENABLED" = "true" ]; then
            [ -n "$SERVICE_IMAGE_REPOSITORY" ] && [ -n "$KUBERNETESERVICE_URL" ] || exit 1
            SERVICE_IMAGE="$SERVICE_IMAGE_REPOSITORY:$GITHUB_SHA"
            docker build -t "$SERVICE_IMAGE" .
            docker push "$SERVICE_IMAGE"
            curl --fail-with-body -X POST -H "X-CICD-TOKEN: $KUBERNETES_CICD_TOKEN" \
              -F "serviceName=vaultservice" -F "image=$SERVICE_IMAGE" \
              -F "environmentFile=@vaultservice.env" "$KUBERNETESERVICE_URL/api/kubernetes/deploy"
            exit 0
          fi

          docker compose --env-file vaultservice.env up --build -d

          max_retries=40
          retry_interval=15
          success=0

          for i in $(seq 1 $max_retries); do
            echo "Health check attempt $i..."
            if response=$(curl -sS -f http://localhost:6020/api/vault/health) && [ "$response" = "200 OK" ]; then
              echo "Vaultservice is healthy"
              success=1
              break
            else
              echo "Health check failed, retrying in $retry_interval seconds..."
              sleep $retry_interval
            fi
          done

          if [ $success -ne 1 ]; then
            echo "Health check ultimately failed. Tearing down containers."
            docker compose down
            exit 1
          fi

      - name: Cleanup
        if: always()
        run: |
          rm -f vaultservice.env
          echo "Cleaned up vaultservice.env"
